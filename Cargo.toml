[package]
name = "rust-ocpp"
description = "ocpp 1.6, 2.0.1 and 2.1 libraries"
readme = "README.md"
license = "MIT OR Apache-2.0"
version = "3.0.4"
authors = ["Tommy Malmqvist <tommy.malmqvist@codelabs.se"]
homepage = "https://codelabs.se/"
repository = "https://github.com/codelabsab/rust-ocpp"
edition = "2021"
keywords = ["ocpp", "ev", "csms"]
categories = [
    "accessibility",
    "data-structures",
    "embedded",
    "encoding",
    "web-programming::websocket",
]
publish = true
exclude = ["docs/", "src/tests"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# std enables validator/regex-based validation, chrono::Utc::now(), and std
# support in rust_decimal/serde_json. Disable it (no-default-features) for
# no_std (alloc-only) builds.
std = [
    "dep:regex",
    "dep:validator",
    "serde/std",
    "chrono/now",
    "rust_decimal/std",
    "rust_decimal/serde-with-arbitrary-precision",
    "serde_json/std",
]
# No default feature, so each version must be explicitly enabled
v1_6 = []
v2_0_1 = []
# Not quite ready for use yet - needs to drop the use of getters and setters and more.
# Run clippy on it to gain an appreciation of what must be done
wip_v2_1 = []


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
chrono = { version = "0.4.43", default-features = false, features = [
    "serde",
    "alloc",
] }
validator = { version = "0.20.0", default-features = false, features = [
    "derive",
], optional = true }
regex = { version = "1.12.3", optional = true }
rust_decimal = { version = "1.36.0", default-features = false, features = [
    "serde",
] }
rust_decimal_macros = "1.40.0"
serde_json = { version = "1", default-features = false, features = [
    "alloc",
    "raw_value",
] }

[dev-dependencies]
chrono = { version = "0.4.43", default-features = false, features = ["clock"] }
mockall = "0.13.1"
jsonschema = "0.42.1"
